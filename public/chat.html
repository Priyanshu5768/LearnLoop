<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages – Learn Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .chat-container { height: calc(100vh - 200px); display: flex; }
    .conversations-list { width: 320px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .messages-list { flex: 1; overflow-y: auto; padding: 1rem; }
    .message-bubble { max-width: 70%; padding: 10px 15px; border-radius: 18px; margin-bottom: 10px; }
    .message-sent { background: linear-gradient(45deg, #667eea, #764ba2); margin-left: auto; border-bottom-right-radius: 4px; }
    .message-received { background: rgba(255,255,255,0.15); border-bottom-left-radius: 4px; }
    .convo-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: all 0.3s; }
    .convo-item:hover { background: rgba(255,255,255,0.1); }
    .convo-item.active { background: rgba(255,255,255,0.18); }
    .resource-card { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 3px solid #667eea; }
    .reward-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #667eea, #764ba2); padding: 30px; border-radius: 20px; text-align: center; z-index: 9999; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: popIn 0.5s ease; }
    @keyframes popIn { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
    @media (max-width: 767px) { .conversations-list { width: 100%; } .chat-container { flex-direction: column; } }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-lightning-charge-fill me-1"></i>Learn Loop</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="text-white"><i class="bi bi-list fs-4"></i></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link" href="browse.html">Browse Skills</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="exchange.html">Exchanges</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-gear me-2"></i>Profile</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="chat-logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-3">
  <h2 class="fw-bold mb-4"><i class="bi bi-chat-dots me-2"></i>Messages</h2>
  
  <div class="glass-card chat-container">
    <div class="conversations-list" id="conversations-list">
      <div id="convos-loading" class="p-4 text-center"><div class="spinner-border text-light"></div></div>
      <div id="convos-empty" class="p-4 text-center d-none"><p class="text-white-50"><i class="bi bi-inbox fs-4 d-block mb-2"></i>No conversations yet</p></div>
      <div id="convos-content"></div>
    </div>
    
    <div class="chat-area" id="chat-area">
      <div class="empty-chat" id="empty-chat">
        <div class="text-center"><i class="bi bi-chat-text fs-1 d-block mb-3"></i><p>Select a conversation to start</p></div>
      </div>
      <div id="chat-content" class="d-none">
        <div class="p-3 border-bottom d-flex align-items-center gap-3" style="border-color: rgba(255,255,255,0.1) !important;">
          <div id="chat-user-avatar"></div>
          <div>
            <h6 class="mb-0 fw-bold" id="chat-user-name">User</h6>
            <small class="text-white-50" id="chat-skill-name">Skill</small>
          </div>
          <div class="ms-auto d-flex gap-2">
            <button class="btn btn-sm btn-gradient" id="resources-btn"><i class="bi bi-folder-open me-1"></i>Resources</button>
            <button class="btn btn-sm btn-outline-light-custom" id="complete-btn"><i class="bi bi-check-circle me-1"></i>Complete</button>
          </div>
        </div>
        
        <ul class="nav nav-tabs px-3 pt-2" style="background: rgba(0,0,0,0.1);">
          <li class="nav-item"><a class="nav-link active text-white" data-bs-toggle="tab" href="#chat-messages">Chat</a></li>
          <li class="nav-item"><a class="nav-link text-white" data-bs-toggle="tab" href="#chat-resources">Resources</a></li>
        </ul>
        
        <div class="tab-content" style="flex:1; overflow-y: auto;">
          <div class="tab-pane fade show active h-100" id="chat-messages">
            <div class="messages-list" id="messages-list"></div>
            <div class="p-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
              <form id="message-form" class="d-flex gap-2">
                <input type="text" class="form-control form-control-glass" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="btn btn-gradient"><i class="bi bi-send"></i></button>
              </form>
            </div>
          </div>
          
          <div class="tab-pane fade h-100" id="chat-resources">
            <div class="p-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0"><i class="bi bi-folder-open me-2"></i>Shared Resources</h6>
                <button class="btn btn-sm btn-gradient" id="add-resource-btn"><i class="bi bi-plus-lg me-1"></i>Add</button>
              </div>
              <div id="resources-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="resourceModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-card" style="background:rgba(102,126,234,0.9);border:none;">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-upload me-2"></i>Upload Resource</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="resource-form">
          <div class="mb-3">
            <label>Select File</label>
            <input type="file" class="form-control form-control-glass" id="resource-file" required>
          </div>
          <div class="mb-3">
            <label>Description (optional)</label>
            <textarea class="form-control form-control-glass" id="resource-description" rows="2" placeholder="Brief description..."></textarea>
          </div>
          <button type="submit" class="btn btn-gradient w-100"><i class="bi bi-upload me-2"></i>Upload</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="reward-popup" class="reward-popup d-none">
  <div class="fs-1 mb-3">🎉</div>
  <h4 class="fw-bold mb-2">You Earned!</h4>
  <div class="fs-1 fw-bold text-warning mb-2" id="reward-points">+5 Points</div>
  <div id="reward-badges"></div>
  <button class="btn btn-light mt-3" onclick="document.getElementById('reward-popup').classList.add('d-none')">Awesome!</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  let currentExchangeId = null;
  let chatStartTime = null;
  let rewardClaimed = false;
  let rewardCheckInterval = null;

  document.getElementById('chat-logout')?.addEventListener('click', (e) => { e.preventDefault(); logout(); });

  document.getElementById('add-resource-btn').addEventListener('click', () => new bootstrap.Modal(document.getElementById('resourceModal')).show());
  document.getElementById('resources-btn').addEventListener('click', () => { bootstrap.Tab.getOrCreateInstance(document.querySelector('#chat-resources')).show(); loadResources(); });

  document.getElementById('resource-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('resource-file');
    const description = document.getElementById('resource-description').value;
    const file = fileInput.files[0];
    if (!file) { alert('Please select a file'); return; }
    
    const reader = new FileReader();
    reader.onload = async function(event) {
      try {
        const res = await fetch(`/api/resources/${currentExchangeId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, mimeType: file.type, data: event.target.result.split(',')[1], description })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        bootstrap.Modal.getInstance(document.getElementById('resourceModal')).hide();
        document.getElementById('resource-form').reset();
        loadResources();
        alert('Resource uploaded!');
      } catch (err) { alert(err.message); }
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('complete-btn').addEventListener('click', async () => {
    if (!confirm('Mark this exchange as completed? The other user must also approve.')) return;
    try {
      const res = await fetch(`/api/exchange/${currentExchangeId}/complete`, { method: 'PUT', headers: { 'Content-Type': 'application/json' } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      
      if (data.bothCompleted) {
        alert('Exchange fully completed! 🎉');
        document.getElementById('complete-btn').disabled = true;
        document.getElementById('complete-btn').innerHTML = '<i class="bi bi-check-circle"></i> Completed';
      } else if (data.completed) {
        alert('You have approved! Waiting for the other user to approve.');
        document.getElementById('complete-btn').innerHTML = '<i class="bi bi-hourglass-split"></i> Waiting...';
        document.getElementById('complete-btn').disabled = true;
      }
    } catch (err) { alert(err.message); }
  });

  async function loadResources() {
    if (!currentExchangeId) return;
    try {
      const res = await fetch(`/api/resources/${currentExchangeId}`);
      const data = await res.json();
      const typeIcons = { pdf: '📄', image: '🖼️', notes: '📝', code: '💻', other: '📁', link: '🔗' };
      document.getElementById('resources-list').innerHTML = data.resources?.length 
        ? data.resources.map(r => `<div class="resource-card"><h6 class="mb-1">${typeIcons[r.type] || '📁'} ${r.title}</h6><p class="small text-white-50 mb-1">${r.description || ''}</p>${r.link ? `<a href="${r.link}" target="_blank" class="btn btn-sm btn-gradient mt-2"><i class="bi bi-download me-1"></i>Download</a>` : ''}</div>`).join('')
        : '<p class="text-center text-white-50 py-5">No resources shared yet</p>';
    } catch (err) { console.error(err); }
  }

  function checkAutoReward() {
    if (!chatStartTime || rewardClaimed || !currentExchangeId) return;
    const minutes = Math.floor((Date.now() - chatStartTime) / 60000);
    if (minutes >= 2) {
      rewardClaimed = true;
      fetch(`/api/gamify/checkin/${currentExchangeId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ duration: minutes })
      }).then(r => r.json()).then(data => {
        if (data.success) {
          document.getElementById('reward-points').textContent = `+${data.pointsEarned} Points!`;
          document.getElementById('reward-badges').innerHTML = data.newBadges?.length ? `<p class="mb-0">New Badge: <strong>${data.newBadges.join(', ')}</strong></p>` : '';
          document.getElementById('reward-popup').classList.remove('d-none');
        }
      }).catch(() => {});
    }
  }

  async function loadConversations() {
    try {
      const data = await api('GET', '/messages/conversations');
      document.getElementById('convos-loading').classList.add('d-none');
      if (!data.conversations?.length) { document.getElementById('convos-empty').classList.remove('d-none'); return; }
      document.getElementById('convos-content').innerHTML = data.conversations.map(c => `
        <div class="convo-item ${c.status === 'completed' ? 'opacity-50' : ''}" data-exchange="${c.exchange_id}" data-name="${c.other_user_name}" data-gender="${c.other_user_gender || 'other'}" data-skill="${c.skill_name}" data-status="${c.status}">
          <div class="d-flex gap-2">
            <div class="profile-avatar-sm" style="background: ${c.other_user_gender === 'male' ? 'linear-gradient(45deg,#4a90d9,#357abd)' : c.other_user_gender === 'female' ? 'linear-gradient(45deg,#e91e8c,#c2185b)' : 'linear-gradient(45deg,#9c27b0,#7b1fa2)'}">
              <i class="bi bi-${c.other_user_gender === 'male' ? 'gender-male' : c.other_user_gender === 'female' ? 'gender-female' : 'person-fill'}" style="font-size:0.9rem"></i>
            </div>
            <div class="flex-grow-1"><strong class="small">${c.other_user_name}</strong><p class="mb-0 text-white-50 small text-truncate">${c.last_message || 'Start chatting!'}</p><small class="text-white-50">${c.skill_name}</small></div>
          </div>
        </div>`).join('');
      document.querySelectorAll('.convo-item').forEach(item => item.addEventListener('click', () => {
        document.querySelectorAll('.convo-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        openChat(item.dataset.exchange, item.dataset.name, item.dataset.gender, item.dataset.skill, item.dataset.status);
      }));
    } catch (err) { console.error(err); }
  }

  function openChat(exchangeId, userName, gender, skillName, status) {
    currentExchangeId = exchangeId;
    chatStartTime = Date.now();
    rewardClaimed = false;
    clearInterval(rewardCheckInterval);
    rewardCheckInterval = setInterval(checkAutoReward, 10000);
    
    document.getElementById('empty-chat').classList.add('d-none');
    document.getElementById('chat-content').classList.remove('d-none');
    document.getElementById('chat-user-name').textContent = userName;
    document.getElementById('chat-skill-name').textContent = skillName;
    document.getElementById('chat-user-avatar').innerHTML = `<div class="profile-avatar-sm" style="width:40px;height:40px;font-size:0.9rem;background:${gender === 'male' ? 'linear-gradient(45deg,#4a90d9,#357abd)' : gender === 'female' ? 'linear-gradient(45deg,#e91e8c,#c2185b)' : 'linear-gradient(45deg,#9c27b0,#7b1fa2)'}"><i class="bi bi-${gender === 'male' ? 'gender-male' : gender === 'female' ? 'gender-female' : 'person-fill'}"></i></div>`;
    
    if (status === 'completed') {
      document.getElementById('complete-btn').disabled = true;
      document.getElementById('complete-btn').innerHTML = '<i class="bi bi-check"></i> Completed';
    } else {
      document.getElementById('complete-btn').disabled = false;
      document.getElementById('complete-btn').innerHTML = '<i class="bi bi-check-circle me-1"></i>Complete';
    }
    
    loadMessages();
    bootstrap.Tab.getOrCreateInstance(document.querySelector('#chat-messages')).show();
  }

  async function loadMessages() {
    if (!currentExchangeId) return;
    try {
      const data = await api('GET', `/messages/${currentExchangeId}`);
      const user = getUser();
      document.getElementById('messages-list').innerHTML = data.messages?.length
        ? data.messages.map(m => `<div class="message-bubble ${m.sender_id == user.id ? 'message-sent' : 'message-received'}"><div class="small fw-bold mb-1">${m.sender_name}</div><div>${m.message}</div><div class="text-end mt-1" style="font-size:0.7rem;opacity:0.7">${timeAgo(m.created_at)}</div></div>`).join('')
        : '<p class="text-center text-white-50">Say hi! 👋</p>';
      document.getElementById('messages-list').scrollTop = document.getElementById('messages-list').scrollHeight;
    } catch (err) { console.error(err); }
  }

  document.getElementById('message-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('message-input');
    const message = input.value.trim();
    if (!message || !currentExchangeId) return;
    try {
      await api('POST', `/messages/${currentExchangeId}`, { message });
      input.value = '';
      loadMessages();
    } catch (err) { alert(err.message); }
  });

  setInterval(() => { if (currentExchangeId) loadMessages(); }, 3000);
  loadConversations();
</script>
</body>
</html>
