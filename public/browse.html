<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Skills – Learn Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-lightning-charge-fill me-1"></i>Learn Loop
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="text-white"><i class="bi bi-list fs-4"></i></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link active" href="browse.html">Browse Skills</a></li>
        <li class="nav-item user-links d-none"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item user-links d-none"><a class="nav-link" href="exchange.html">Exchanges</a></li>
        <li class="nav-item user-links d-none">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-gear me-2"></i>Profile</a></li>
            <li><a class="dropdown-item" href="exchange.html"><i class="bi bi-arrow-left-right me-2"></i>Exchanges</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="browse-logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </li>
        <li class="nav-item auth-links"><a class="btn btn-gradient btn-sm" href="register.html">Get Started</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-3">
  <div class="page-header">
    <h1><i class="bi bi-compass me-2"></i>Browse Skills</h1>
    <p>Find students teaching what you want to learn</p>
  </div>

  <div class="glass-card p-4 mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label>Search</label>
        <input type="text" class="form-control form-control-glass" id="search-input" placeholder="Search skills...">
      </div>
      <div class="col-md-3">
        <label>Category</label>
        <select class="form-select form-select-glass" id="category-filter">
          <option value="all">All Categories</option>
          <option value="Programming">Programming</option>
          <option value="Design">Design</option>
          <option value="Language">Language</option>
          <option value="Data Science">Data Science</option>
          <option value="Creative Arts">Creative Arts</option>
          <option value="Communication">Communication</option>
          <option value="Business">Business</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-md-3">
        <label>Type</label>
        <select class="form-select form-select-glass" id="type-filter">
          <option value="all">All Types</option>
          <option value="teach">Teach</option>
          <option value="learn">Learn</option>
        </select>
      </div>
      <div class="col-md-2">
        <a href="add-skill.html" class="btn btn-gradient w-100"><i class="bi bi-plus-lg me-1"></i>Add</a>
      </div>
    </div>
  </div>

  <div id="skills-grid" class="row g-4"></div>
</div>

<div class="modal fade" id="requestModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-card" style="background:rgba(102,126,234,0.85);border:none;">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-arrow-left-right me-2"></i>Request Exchange</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-3">You are requesting: <strong id="req-skill-name"></strong></p>
        <p class="text-white-75 small mb-3">By: <span id="req-provider"></span></p>
        <form id="request-form">
          <input type="hidden" id="request-skill-id">
          <input type="hidden" id="request-provider-id">
          <div class="mb-3">
            <label>Message (optional)</label>
            <textarea class="form-control form-control-glass" id="request-message" rows="3" placeholder="Introduce yourself and explain why you'd be a good match..."></textarea>
          </div>
          <button type="submit" class="btn btn-gradient w-100">Send Request</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('browse-logout')?.addEventListener('click', (e) => { e.preventDefault(); logout(); });
</script>
</body>
</html>
