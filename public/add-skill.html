<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Skill – Learn Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-lightning-charge-fill me-1"></i>Learn Loop
    </a>
    <div class="ms-auto">
      <a href="dashboard.html" class="btn btn-glass btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-3">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="page-header">
        <h1><i class="bi bi-plus-circle me-2"></i>Add a Skill</h1>
        <p>Share what you can teach or want to learn</p>
      </div>

      <div class="glass-card p-4">
        <form id="add-skill-form">
          <div class="mb-3">
            <label>Skill Name *</label>
            <input type="text" class="form-control form-control-glass" id="skill-name" placeholder="e.g., JavaScript, Photography, Public Speaking" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Category *</label>
              <select class="form-select form-select-glass" id="skill-category" required>
                <option value="">Select category</option>
                <option value="Programming">Programming</option>
                <option value="Design">Design</option>
                <option value="Language">Language</option>
                <option value="Data Science">Data Science</option>
                <option value="Creative Arts">Creative Arts</option>
                <option value="Communication">Communication</option>
                <option value="Business">Business</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label>Type *</label>
              <select class="form-select form-select-glass" id="skill-type" required>
                <option value="">Select type</option>
                <option value="teach">I Can Teach This</option>
                <option value="learn">I Want to Learn This</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label>Description</label>
            <textarea class="form-control form-control-glass" id="skill-description" rows="4" placeholder="Describe your skill level, what you'll cover, or what you're looking for..."></textarea>
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-gradient flex-grow-1">
              <i class="bi bi-check-lg me-2"></i>Add Skill
            </button>
            <a href="dashboard.html" class="btn btn-outline-light-custom">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
