<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – Learn Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-lightning-charge-fill me-1"></i>Learn Loop
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="text-white"><i class="bi bi-list fs-4"></i></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link" href="browse.html">Browse Skills</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="exchange.html">Exchanges</a></li>
        <li class="nav-item"><a class="nav-link" href="chat.html">Messages</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i><span class="user-name">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-gear me-2"></i>Profile</a></li>
            <li><a class="dropdown-item" href="exchange.html"><i class="bi bi-arrow-left-right me-2"></i>Exchanges</a></li>
            <li><a class="dropdown-item" href="chat.html"><i class="bi bi-chat-dots me-2"></i>Messages</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="prof-logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-3">
  <div class="row">
    <div class="col-lg-4 mb-4">
      <div class="glass-card p-4 text-center">
        <div id="profile-avatar-display">
          <div class="profile-avatar mx-auto">??</div>
        </div>
        <h4 class="fw-bold mb-1 mt-3" id="profile-name-display">Loading...</h4>
        <p class="text-white-75 small mb-1" id="profile-email-display"></p>
        <p class="text-white-50 small mb-0"><i class="bi bi-calendar3 me-1"></i>Joined <span id="profile-joined"></span></p>
        
        <div class="row g-2 mt-3 pt-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
          <div class="col-6">
            <div class="p-2 rounded" style="background: rgba(255,255,255,0.1);">
              <div class="fs-4 fw-bold text-warning" id="profile-points">0</div>
              <div class="small text-white-50">Points</div>
            </div>
          </div>
          <div class="col-6">
            <div class="p-2 rounded" style="background: rgba(255,255,255,0.1);">
              <div class="fs-4 fw-bold text-success" id="profile-checkins">0</div>
              <div class="small text-white-50">Check-ins</div>
            </div>
          </div>
        </div>
        
        <div class="mt-3">
          <div class="small text-white-50 mb-2">Badges</div>
          <div id="badges-display"></div>
        </div>
      </div>

      <div class="glass-card p-4 mt-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-gear me-2"></i>Edit Profile</h5>
        <form id="profile-form">
          <div class="mb-3">
            <label>Full Name</label>
            <input type="text" class="form-control form-control-glass" id="profile-name" required>
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control form-control-glass" id="profile-email" disabled>
          </div>
          <div class="mb-3">
            <label>I am a</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="gender-male" value="male">
                <label class="form-check-label text-white-75" for="gender-male">
                  <i class="bi bi-gender-male me-1"></i>Male
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="gender-female" value="female">
                <label class="form-check-label text-white-75" for="gender-female">
                  <i class="bi bi-gender-female me-1"></i>Female
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="gender-other" value="other">
                <label class="form-check-label text-white-75" for="gender-other">
                  <i class="bi bi-person me-1"></i>Other
                </label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label>Bio</label>
            <textarea class="form-control form-control-glass" id="profile-bio" rows="3" placeholder="Tell others about yourself..."></textarea>
          </div>
          <button type="submit" class="btn btn-gradient w-100">
            <i class="bi bi-check-lg me-2"></i>Save Changes
          </button>
        </form>
      </div>

      <div class="glass-card p-4 mt-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-lock me-2"></i>Change Password</h5>
        <form id="password-form">
          <div class="mb-3">
            <label>Current Password</label>
            <input type="password" class="form-control form-control-glass" id="current-password" required>
          </div>
          <div class="mb-3">
            <label>New Password</label>
            <input type="password" class="form-control form-control-glass" id="new-password" placeholder="Min. 6 characters" minlength="6" required>
          </div>
          <div class="mb-3">
            <label>Confirm New Password</label>
            <input type="password" class="form-control form-control-glass" id="confirm-password" placeholder="Repeat new password" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-gradient w-100">
            <i class="bi bi-key me-2"></i>Update Password
          </button>
        </form>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="glass-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0"><i class="bi bi-bookmark-star me-2"></i>My Skills</h4>
          <a href="add-skill.html" class="btn btn-sm btn-gradient"><i class="bi bi-plus-lg me-1"></i>Add Skill</a>
        </div>
        <div id="my-skills-grid" class="row g-3"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('prof-logout')?.addEventListener('click', (e) => { e.preventDefault(); logout(); });
  
  document.getElementById('password-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const currentPassword = document.getElementById('current-password').value.trim();
    const newPassword = document.getElementById('new-password').value.trim();
    const confirmPassword = document.getElementById('confirm-password').value.trim();
    
    if (newPassword !== confirmPassword) {
      alert('New passwords do not match!');
      return;
    }
    
    try {
      const res = await fetch('/api/auth/password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword, newPassword })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      
      alert('Password changed successfully!');
      document.getElementById('current-password').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
    } catch (err) {
      alert(err.message);
    }
  });
</script>
</body>
</html>
