<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Learn Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-lightning-charge-fill me-1"></i>Learn Loop
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card glass-card">
    <div class="text-center mb-4">
      <div class="profile-avatar mb-3" style="width:70px;height:70px;font-size:1.8rem;">
        <i class="bi bi-person-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Welcome Back</h3>
      <p class="text-white-75 small">Sign in to continue swapping skills</p>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label>Email Address</label>
        <input type="email" class="form-control form-control-glass" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <div class="position-relative">
          <input type="password" class="form-control form-control-glass" id="login-password" placeholder="Enter your password" required>
          <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 text-white-50" id="toggle-password" style="cursor:pointer;"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-gradient w-100" id="login-btn">
        <span id="login-text">Sign In</span>
        <span id="login-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-white-75 small">
      Don't have an account? <a href="register.html" class="fw-bold text-white">Sign up</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  if (getUser()) location.href = 'dashboard.html';
  
  document.getElementById('toggle-password').addEventListener('click', function() {
    const pwd = document.getElementById('login-password');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      this.classList.replace('bi-eye-slash', 'bi-eye');
    } else {
      pwd.type = 'password';
      this.classList.replace('bi-eye', 'bi-eye-slash');
    }
  });
  
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const txt = document.getElementById('login-text');
    const spn = document.getElementById('login-spinner');
    btn.disabled = true; txt.textContent = 'Signing in...'; spn.classList.remove('d-none');
    
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          email: document.getElementById('login-email').value, 
          password: document.getElementById('login-password').value 
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      setUser(data.user);
      location.href = 'dashboard.html';
    } catch (err) {
      showAlert(err.message);
      btn.disabled = false; txt.textContent = 'Sign In'; spn.classList.add('d-none');
    }
  });
</script>
</body>
</html>
