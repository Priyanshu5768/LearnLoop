<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Learn Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-lightning-charge-fill me-1"></i>Learn Loop
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card glass-card">
    <div class="text-center mb-4">
      <div class="profile-avatar mb-3" style="width:70px;height:70px;font-size:1.8rem;">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Join Learn Loop</h3>
      <p class="text-white-75 small">Create an account and start swapping skills</p>
    </div>

    <form id="register-form">
      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" class="form-control form-control-glass" id="reg-name" placeholder="John Doe" required>
      </div>
      <div class="mb-3">
        <label>Email Address</label>
        <input type="email" class="form-control form-control-glass" id="reg-email" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label>I am a</label>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="gender-male" value="male" required>
            <label class="form-check-label text-white-75" for="gender-male">
              <i class="bi bi-gender-male me-1"></i>Male
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="gender-female" value="female">
            <label class="form-check-label text-white-75" for="gender-female">
              <i class="bi bi-gender-female me-1"></i>Female
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="gender-other" value="other">
            <label class="form-check-label text-white-75" for="gender-other">
              <i class="bi bi-person me-1"></i>Other
            </label>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <div class="position-relative">
          <input type="password" class="form-control form-control-glass" id="reg-password" placeholder="Min. 6 characters" minlength="6" required>
          <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 text-white-50 toggle-pwd" data-target="reg-password" style="cursor:pointer;"></i>
        </div>
      </div>
      <div class="mb-3">
        <label>Confirm Password</label>
        <div class="position-relative">
          <input type="password" class="form-control form-control-glass" id="reg-confirm" placeholder="Repeat your password" minlength="6" required>
          <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 text-white-50 toggle-pwd" data-target="reg-confirm" style="cursor:pointer;"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-gradient w-100" id="reg-btn">
        <span id="reg-text">Create Account</span>
        <span id="reg-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-white-75 small">
      Already have an account? <a href="login.html" class="fw-bold text-white">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  if (getUser()) location.href = 'dashboard.html';
  
  document.querySelectorAll('.toggle-pwd').forEach(icon => {
    icon.addEventListener('click', function() {
      const input = document.getElementById(this.dataset.target);
      if (input.type === 'password') {
        input.type = 'text';
        this.classList.replace('bi-eye-slash', 'bi-eye');
      } else {
        input.type = 'password';
        this.classList.replace('bi-eye', 'bi-eye-slash');
      }
    });
  });
  
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    
    if (password !== confirm) { showAlert('Passwords do not match.'); return; }
    
    const btn = document.getElementById('reg-btn');
    const txt = document.getElementById('reg-text');
    const spn = document.getElementById('reg-spinner');
    btn.disabled = true; txt.textContent = 'Creating...'; spn.classList.remove('d-none');
    
    try {
      const gender = document.querySelector('input[name="gender"]:checked')?.value || 'other';
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, gender })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');
      setUser(data.user);
      location.href = 'dashboard.html';
    } catch (err) {
      showAlert(err.message);
      btn.disabled = false; txt.textContent = 'Create Account'; spn.classList.add('d-none');
    }
  });
</script>
</body>
</html>
